version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: allu-invest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allu_invest
    ports:
      - "5433:5432"
    volumes:
      - allu_invest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  allu_invest_pgdata:
